<title>Comfort Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fdf3f8; --surface:#ffffff; --surface-2:#f8edf3; --marble:#fdf8fa;
  --fg:#2c1322; --fg-soft:#6b3650; --muted:#7a5566; --line:#f3d9e6; --line-gold:#e4cfa6;
  --primary:#c0276e; --primary-deep:#9e1c58; --primary-soft:#fbe3ef;
  --lav:#7c53e0; --lav-soft:#efe9fd;
  --gold:#b08a4a; --gold-soft:#f5ecd8; --gold-text:#85652a;
  --ok:#2f8a5b; --ok-soft:#e1f1e8; --warn:#9c5a1e; --warn-soft:#f8ebda;
  --radius:18px;
  --shadow-sm:0 1px 2px rgba(120,40,80,.05);
  --shadow:0 2px 6px rgba(120,40,80,.05),0 10px 30px rgba(130,30,80,.08);
  --shadow-lg:0 6px 16px rgba(120,40,80,.08),0 24px 60px rgba(130,30,80,.14);
  --t:220ms cubic-bezier(.4,0,.2,1);
  --serif:"Lora",Georgia,serif; --sans:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(130% 80% at 12% -5%,var(--marble) 0%,transparent 50%),radial-gradient(90% 60% at 95% 0%,var(--surface-2) 0%,transparent 45%)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:6px}
.gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.eyebrow{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.ch{animation:shimmer 16s linear infinite!important}.mq-track{animation:mq 120s linear infinite!important}.brandband .sp,.check{animation:none!important}html{scroll-behavior:auto}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.bar{display:flex;align-items:center;gap:12px;padding-block:13px}
.logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--primary-soft),var(--surface));border:1.5px solid var(--gold);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.logo svg{width:21px;height:21px}
.brand{margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.15rem;display:block;line-height:1.05}
.brand span{font-size:.66rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.nav{display:flex;gap:24px;margin-right:4px}
.nav a{color:var(--fg-soft);font-size:.86rem;font-weight:500;transition:var(--t)}
.nav a:hover{color:var(--primary)}
@media(max-width:760px){.nav{display:none}}
.lang{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{padding:5px 11px;border-radius:999px;font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.lang button.on{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
.btn{background:var(--primary);color:#fff;padding:13px 24px;border-radius:999px;font-weight:600;font-size:.9rem;transition:var(--t);display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.btn:hover:not(:disabled){background:var(--primary-deep);box-shadow:var(--shadow)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn-sm{padding:10px 18px;font-size:.82rem}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:none}
.btn.block{width:100%;justify-content:center;display:flex}
@media(max-width:520px){.hdr-cta{display:none}}

section{padding-block:clamp(44px,7vw,80px)}
.center{text-align:center}
.lead-tag{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.lead-tag::before,.lead-tag::after{content:"";width:22px;height:1px;background:var(--gold)}

/* BRAND BAND (animated name) */
.brandband{text-align:center;padding-block:clamp(42px,8vw,76px) clamp(20px,3vw,34px);position:relative;overflow:hidden}
.brandband .eyebrow{display:block;margin-bottom:18px;animation:fadein 1s .1s both}
.bigname{font-family:var(--serif);font-weight:600;line-height:.92;font-size:clamp(2.8rem,12.5vw,7.4rem);letter-spacing:.01em;
  margin:0;display:flex;flex-direction:column;align-items:center}
.bigname .w{display:block;overflow:hidden;padding:.1em .06em .14em;margin-block:-.05em}
.bigname .l2{font-style:italic}
.ch{display:inline-block;background:linear-gradient(100deg,var(--primary) 0%,var(--gold) 30%,var(--primary-deep) 55%,var(--gold) 78%,var(--primary) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .95s cubic-bezier(.2,.85,.25,1) backwards,shimmer 7s linear infinite;
  animation-delay:calc(var(--i)*65ms),calc(var(--i)*-420ms);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ch:hover{transform:translateY(-.06em) rotate(-3deg)}
@keyframes rise{from{transform:translateY(105%) rotate(7deg);opacity:0}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes risein{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,3vw,1.5rem);color:var(--fg-soft);margin-top:14px;animation:fadein 1.2s .5s both}
.brandband .sp{position:absolute;color:var(--gold);opacity:.55;animation:float 6s ease-in-out infinite}
.brandband .sp svg{width:100%;height:100%}
.brandband .sp1{top:16%;left:9%;width:30px;height:30px}
.brandband .sp2{top:28%;right:11%;width:40px;height:40px;animation-delay:1.5s}
.brandband .sp3{bottom:16%;left:18%;width:22px;height:22px;animation-delay:3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}

/* HERO */
.hero{padding-top:clamp(10px,2vw,20px)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:34px;text-align:center}}
.hero h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.05}
.hero h2 i{font-style:italic;color:var(--primary)}
.hero p{color:var(--fg-soft);font-size:1.05rem;margin:16px 0 0;max-width:46ch}
@media(max-width:820px){.hero p{margin-inline:auto}}
.hero-cta{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
@media(max-width:820px){.hero-cta{justify-content:center}}
.proof{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stars{display:inline-flex;gap:2px;color:var(--gold)}.stars svg{width:14px;height:14px}
.proof b{font-weight:600}.proof .sep{color:var(--line)}.proof span{color:var(--muted);font-size:.84rem}
.hero-art{position:relative;aspect-ratio:4/5;border-radius:24px;border:1.5px solid var(--gold);box-shadow:var(--shadow-lg);overflow:hidden;background:var(--surface-2)}
.hero-art::before{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.5);border-radius:16px;z-index:1;pointer-events:none}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.hero-art{max-width:360px;margin:0 auto}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);padding:22px 16px;text-align:center}
.stat b{font-family:var(--serif);font-size:1.9rem;color:var(--primary-deep);display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);display:block;margin-top:7px}

.sec-head{text-align:center;max-width:46ch;margin:0 auto 38px}
.sec-head h2{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-top:10px}
.sec-head p{color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:760px){.svc-grid{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.svc-grid{grid-template-columns:1fr}}
.svc-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;transition:var(--t)}
.svc-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:var(--line-gold)}
.svc-card .ic{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:16px}
.svc-card .ic svg{width:22px;height:22px}
.svc-card h3{font-size:1.15rem}
.svc-card .dur{color:var(--muted);font-size:.8rem;margin-top:3px}
.svc-card .price{font-family:var(--serif);font-size:1.5rem;color:var(--primary-deep);margin-top:14px;font-weight:600}
.svc-card .price small{font-family:var(--sans);font-size:.62rem;color:var(--muted)}

.band{background:var(--surface-2);border-block:1px solid var(--line)}
.about-photo{border-radius:20px;overflow:hidden;border:1.5px solid var(--gold);box-shadow:var(--shadow);margin-bottom:36px;aspect-ratio:16/9;position:relative}
.about-photo img{width:100%;height:100%;object-fit:cover}
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media(max-width:620px){.why-grid{grid-template-columns:1fr}}
.why{display:flex;gap:16px;align-items:flex-start}
.why .ic{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.why .ic svg{width:22px;height:22px}
.why h3{font-size:1.15rem}
.why p{color:var(--fg-soft);font-size:.9rem;margin-top:5px}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.photo-slot{position:relative;border-radius:18px;border:1.5px solid var(--gold);overflow:hidden;aspect-ratio:3/4;background:var(--surface-2)}
.photo-slot::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.45);border-radius:12px;z-index:1;pointer-events:none}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:620px){.gallery-grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 10px;scrollbar-width:none}.gallery-grid::-webkit-scrollbar{display:none}.gallery-grid .photo-slot{flex:0 0 auto;width:auto;height:min(64vh,440px);aspect-ratio:var(--ar);scroll-snap-align:center}}

.reviews{background:linear-gradient(140deg,var(--primary-soft),var(--lav-soft));border-radius:28px;padding:clamp(32px,5vw,56px);box-shadow:var(--shadow)}
.rv-grid{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
@media(max-width:620px){.rv-grid{grid-template-columns:1fr;gap:24px;text-align:center}}
.rv-score .big{font-family:var(--serif);font-size:4.5rem;line-height:.9;color:var(--primary-deep);font-weight:700}
.rv-score .stars{justify-content:center;margin:8px 0}.rv-score .stars svg{width:18px;height:18px}
.rv-score .cnt{color:var(--fg-soft);font-size:.85rem}
.rv-bars{display:grid;gap:9px}
.rv-bar{display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--fg-soft)}
.rv-bar .n{width:36px;display:flex;align-items:center;gap:3px;color:var(--gold)}.rv-bar .n svg{width:11px;height:11px}
.rv-bar .track{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent);overflow:hidden}
.rv-bar .fill{height:100%;background:var(--primary);border-radius:99px}
.rv-bar .v{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.rv-note{margin-top:24px;text-align:center;font-size:.82rem;color:var(--fg-soft)}

#booking{scroll-margin-top:80px}
.steps{display:flex;gap:8px;max-width:560px;margin:4px auto 22px;font-size:.72rem}
.step{flex:1;padding:9px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:flex;gap:7px;align-items:center;justify-content:center;transition:var(--t)}
.step b{width:19px;height:19px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:.68rem;border:1px solid var(--line);flex:none;font-weight:600}
.step.active{background:var(--primary-soft);color:var(--primary-deep)}
.step.active b{background:var(--primary);color:#fff;border-color:var(--primary)}
.step.done b{background:var(--gold);color:#fff;border-color:var(--gold)}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.step span{display:none}.step{flex:0 0 auto;padding:9px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.marble{background:linear-gradient(140deg,var(--marble),var(--surface));position:relative}
.card.marble::before,.card.marble::after{content:"";position:absolute;width:30px;height:30px;pointer-events:none;border:1.5px solid var(--gold);opacity:.55}
.card.marble::before{top:14px;left:14px;border-right:none;border-bottom:none}
.card.marble::after{bottom:14px;right:14px;border-left:none;border-top:none}
.pad{padding:clamp(20px,4vw,30px)}
.b-sec{display:flex;align-items:baseline;gap:11px;margin-bottom:5px}
.b-sec h3{font-size:1.4rem}
.b-sec .n{font-family:var(--serif);font-size:1.05rem;color:var(--gold);font-style:italic}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.masters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.masters{grid-template-columns:1fr}}
.master{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;transition:var(--t)}
.master:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.master[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:var(--shadow-sm)}
.master .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.2rem;color:#fff;flex:none}
.master .t{min-width:0}.master .t b{display:block;font-weight:500;font-size:.96rem}.master .t small{color:var(--muted);font-size:.74rem}
.tier{display:inline-block;margin-left:6px;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line-gold);border-radius:4px;padding:1px 5px;vertical-align:middle}
.svc{display:grid;margin-top:6px}
.svc button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 8px;background:none;border:none;border-bottom:1px solid var(--line);transition:var(--t)}
.svc button:last-child{border-bottom:none}
.svc button:hover,.svc button[aria-pressed="true"]{padding-left:14px}
.svc .mark{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-gold);flex:none;transition:var(--t)}
.svc button[aria-pressed="true"] .mark{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.svc .t{flex:1;min-width:0}.svc .t b{display:block;font-weight:400;font-size:.95rem}.svc .t small{color:var(--muted);font-size:.78rem}
.svc .pr{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--primary-deep);flex:none;font-variant-numeric:tabular-nums}
.svc .pr small{font-family:var(--sans);font-size:.6rem;color:var(--muted)}
.daynav{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.daynav button{flex:none;min-width:62px;padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.3;transition:var(--t)}
.daynav button:hover{border-color:var(--primary)}
.daynav button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.daynav small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.daynav b{font-family:var(--serif);font-size:1.3rem;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.slots button{padding:13px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:.92rem;transition:var(--t)}
.slots button:hover:not(:disabled){border-color:var(--primary)}
.slots button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.slots button:disabled{color:var(--muted);background:var(--surface-2);cursor:not-allowed;text-decoration:line-through;opacity:.5}
.foot{display:flex;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}
.summary{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}.summary b{color:var(--fg);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:460px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.78rem;color:var(--fg-soft);font-weight:500}
.field input{font-family:inherit;font-size:1rem;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;transition:var(--t)}
.field input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}
.hold{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:13px;padding:13px 16px;font-size:.84rem;margin-bottom:20px;font-weight:500}
.hold svg{width:17px;height:17px;flex:none}.hold .clock{font-variant-numeric:tabular-nums;font-weight:600;margin-left:auto;font-size:.98rem}
.recap{border:1px solid var(--line-gold);border-radius:14px;padding:18px;margin-bottom:20px;display:grid;gap:11px;background:linear-gradient(140deg,var(--marble),var(--surface))}
.recap .r{display:flex;justify-content:space-between;gap:12px;font-size:.88rem}.recap .r span{color:var(--muted)}.recap .r b{text-align:right;font-weight:500}
.recap .tot{border-top:1px solid var(--line-gold);padding-top:11px;align-items:baseline}.recap .tot b{font-family:var(--serif);font-size:1.4rem;color:var(--primary-deep)}
.blik{display:flex;flex-direction:column;align-items:center;gap:15px;padding:6px 0}
.blik .paylogo{font-size:.82rem;color:var(--muted);display:flex;gap:7px;align-items:center}.blik .paylogo b{color:#e30613;font-weight:700}
.blik-code{display:flex;gap:9px}
.blik-code input{width:46px;height:56px;text-align:center;font-size:1.45rem;font-weight:500;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums;transition:var(--t)}
.blik-code input:focus{outline:2px solid var(--gold);border-color:transparent}
.blik small{color:var(--muted);font-size:.78rem;text-align:center;max-width:32ch}
.done{text-align:center;padding:16px 4px}
.check{width:72px;height:72px;border-radius:50%;background:var(--primary-soft);border:1.5px solid var(--gold);color:var(--primary);display:grid;place-items:center;margin:0 auto 18px;animation:pop .5s var(--t)}
.check svg{width:34px;height:34px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.sms{display:flex;gap:12px;text-align:left;background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-top:16px;align-items:flex-start}
.sms .ph{width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}.sms .ph svg{width:16px;height:16px}
.sms .msg{font-size:.82rem}.sms .msg b{display:block;margin-bottom:3px;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* admin */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(44,19,34,.45);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:20px 16px 40px;overflow-y:auto}
.overlay.open{display:flex}
.admin{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;margin-top:40px;overflow:hidden;animation:pop .3s var(--t)}
.admin-hd{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);background:linear-gradient(140deg,var(--marble),var(--surface))}
.admin-hd h3{font-size:1.5rem;margin-right:auto}
.admin-hd .lbl{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line-gold);border-radius:5px;padding:2px 7px}
.admin-hd .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.admin-hd .x:hover{color:var(--primary)}
.atabs{display:flex;gap:4px;padding:12px 24px 0}

.admin-stat{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.admin-stat div{padding:14px;text-align:center;border-right:1px solid var(--line)}
.admin-stat div:last-child{border-right:none}
.admin-stat b{font-family:var(--serif);font-size:1.6rem;color:var(--primary-deep);display:block;line-height:1}

.admin-body{padding:10px 24px 20px}

.sw.on::after{left:22px}

.grafik{overflow-x:auto;padding:14px 24px 4px}
.gtbl{display:grid;min-width:460px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
.gtbl>div{background:var(--surface)}
.gh{padding:9px 5px;text-align:center;font-size:.72rem;font-weight:600;background:var(--surface-2)!important;display:flex;flex-direction:column;align-items:center;gap:3px}

.tc{min-height:48px;padding:4px}

footer{border-top:1px solid var(--line);padding-block:40px;margin-top:20px}

    <div class="grid2"><div class="field"><label for="f-name">${t("f_name")}</label><input id="f-name" value="${S.name}" oninput="S.name=this.value;rb()" placeholder="${t("ph_name")}"></div>
      <div class="field"><label for="f-phone">${t("f_phone")}</label><input id="f-phone" value="${S.phone}" oninput="S.phone=this.value;rb()" placeholder="600 100 200" inputmode="tel"></div></div>
    <div class="blik"><div class="paylogo">${t("blik_txt")} <b>BLIK</b></div><div class="blik-code">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" aria-label="${i+1}" oninput="blik(this,${i})" ${ok?"":"disabled"}>`).join("")}</div><small>${t("blik_hint")}</small></div>
    <div class="foot"><button class="btn ghost" onclick="S.step=3;clearInterval(S.holdT);render()">${t("btn_back")}</button><button class="btn" id="payBtn" ${ok?"":"disabled"} onclick="doPay()" style="margin-left:auto">${t("btn_pay")} ${DEPOSIT} zł</button></div></div>`;
}
function done(){
  const svc=SERVICES.find(x=>x.id===S.service),m=MASTERS[S.master],d=DAYS[S.dayIdx];const ds=`${DNI[d.getDay()]} ${d.getDate()} ${MIES[d.getMonth()]}`;
  return `<div class="card marble pad done"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 style="font-size:2rem">${t("done_h")}</h2><p class="sub" style="margin-top:8px">${svc.name} · ${m.name}<br>${ds}, ${S.slot}</p>
    <div class="sms"><div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
      <div class="msg"><b>${t("sms_sent")} ${S.phone||t("sms_num")}</b>${t("sms_body")(svc.name,ds,S.slot)}</div></div>
    <div class="sms" style="opacity:.75"><div class="ph" style="background:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg></div>
      <div class="msg"><b>${t("rem_label")}</b>${t("rem_body")(S.slot)}</div></div>
    <button class="btn block" style="margin-top:22px" onclick="reset()">${t("btn_again")}</button></div>`;
}
function pickMaster(i){S.master=i;S.slot=null;render()}
function pickSvc(id){S.service=id;S.slot=null;render()}
function pickDay(i){S.dayIdx=i;S.slot=null;render()}
function pickSlot(h){S.slot=h;render()}
function goData(){S.step=4;startHold();render();document.getElementById("booking").scrollIntoView({block:"start"})}
function rb(){const ok=S.name.trim().length>2&&S.phone.replace(/\D/g,"").length>=9;const b=document.getElementById("payBtn");if(b)b.disabled=!ok;document.querySelectorAll(".blik-code input").forEach(i=>i.disabled=!ok)}
function blik(inp,i){inp.value=inp.value.replace(/\D/g,"");const a=[...document.querySelectorAll(".blik-code input")];if(inp.value&&i<5)a[i+1].focus();if(a.every(x=>x.value)){const b=document.getElementById("payBtn");if(b&&!b.disabled)setTimeout(doPay,250)}}
function startHold(){let x=900;S.holdT=setInterval(()=>{x--;const c=document.getElementById("clock");if(c)c.textContent=`${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`;if(x<=0){clearInterval(S.holdT);S.step=3;S.slot=null;render()}},1000)}
let paid=false;
function doPay(){if(paid)return;paid=true;clearInterval(S.holdT);const b=document.getElementById("payBtn");if(b){b.textContent=t("processing");b.disabled=true}setTimeout(()=>{paid=false;S.step=5;render()},900)}
function reset(){Object.assign(S,{step:1,master:null,service:null,dayIdx:0,slot:null,name:"",phone:""});render();document.getElementById("booking").scrollIntoView({block:"start"})}

// admin
const COLORS=["#c0276e","#b08a4a","#7c53e0","#2f8a5b","#d16a9e","#8a6d3b"];
let ADMIN_TAB="grafik";
let admFocus=null;
function openAdmin(){admFocus=document.activeElement;renderAdmin();const o=document.getElementById("adminOverlay");o.classList.add("open");o.querySelector(".x").focus()}
function closeAdmin(){const o=document.getElementById("adminOverlay");if(!o.classList.contains("open"))return;o.classList.remove("open");if(admFocus)admFocus.focus()}
function adminTab(x){ADMIN_TAB=x;document.getElementById("tab-grafik").classList.toggle("on",x==="grafik");document.getElementById("tab-staff").classList.toggle("on",x==="staff");renderAdmin()}
function renderAdmin(){
  document.getElementById("adminTitle").textContent=t("ad_title");
  document.getElementById("tab-grafik").textContent=t("tab_grafik");
  document.getElementById("tab-staff").textContent=t("tab_staff");
  ADMIN_TAB==="grafik"?renderGrafik():renderStaff();
}
function renderGrafik(){
  const ms=MASTERS.filter(m=>m.active);const cols=`54px repeat(${ms.length},minmax(96px,1fr))`;
  let h=`<div class="grafik"><div class="gtbl" style="grid-template-columns:${cols}"><div class="gh corner">${t("godz")}</div>`;
  ms.forEach(m=>h+=`<div class="gh"><span class="av" style="background:${m.color}">${m.name[0]}</span>${m.name}</div>`);
  HOURS.forEach(hr=>{h+=`<div class="tc tl">${hr}</div>`;ms.forEach(m=>{const b=BOOKINGS.find(x=>x.h===hr&&x.m===m.id);h+=`<div class="tc">${b?`<div class="appt ${b.paid?"paid":"pend"}"><b>${b.svc}</b><small>${m.name} · ${b.cl}${b.paid?"":" · "+t("czeka")}</small></div>`:""}</div>`})});
  h+=`</div></div><div class="glegend"><span><i class="gdot" style="background:var(--ok)"></i>${t("leg_paid")}</span><span><i class="gdot" style="background:var(--warn)"></i>${t("leg_pend")}</span></div>`;
  document.getElementById("adminContent").innerHTML=h;
  const p=BOOKINGS.filter(b=>b.paid).length;document.getElementById("adminFoot").innerHTML=`<small>${t("g_foot")(BOOKINGS.length,p)}</small>`;
}
function renderStaff(){
  const act=MASTERS.filter(m=>m.active).length;
  let h=`<div class="admin-stat"><div><b class="tnum">${act}</b><span>${t("st_act")}</span></div><div><b class="tnum">${MASTERS.length}</b><span>${t("st_team")}</span></div><div><b class="tnum">${SERVICES.length}</b><span>${t("st_svc")}</span></div></div><div class="admin-body">`;
  h+=MASTERS.map(m=>`<div class="stf ${m.active?"":"off"}"><span class="av" style="background:${m.color}">${m.name[0]}</span>
    <span class="info"><b>${m.name}${m.tier?' <span class="tier">'+t("instr")+'</span>':''}</b><span class="meta">${roleOf(m)} · ${m.hours} · ${SERVICES.length} ${t("uslug")}</span></span>
    <button class="sw ${m.active?"on":""}" role="switch" aria-checked="${m.active}" aria-label="${m.name}" onclick="toggleStaff(${m.id})"></button></div>`).join("")+`</div>`;
  document.getElementById("adminContent").innerHTML=h;
  document.getElementById("adminFoot").innerHTML=`<small>${t("staff_hint")}</small><button class="btn btn-sm" onclick="addStaff()">${t("add_master")}</button>`;
}
function toggleStaff(id){const m=MASTERS.find(x=>x.id===id);m.active=!m.active;if(!m.active&&S.master===id){S.master=null;S.service=null;S.slot=null}renderAdmin();render();renderTeam()}
function addStaff(){const id=Math.max(...MASTERS.map(m=>m.id))+1;MASTERS.push({id,name:"Nowy / Новий",color:COLORS[id%COLORS.length],tier:0,active:true,hours:"10:00–18:00"});renderAdmin();render();renderTeam()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAdmin();closeLb()}});

document.documentElement.classList.add("js");
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

document.querySelectorAll(".bigname .w").forEach((w,wi)=>{const txt=w.textContent;w.textContent="";[...txt].forEach((c,i)=>{const s=document.createElement("span");s.className="ch";s.style.setProperty("--i",i+wi*7);s.textContent=c;w.appendChild(s)})});

(()=>{const set=SERVICES.map(s=>`<span class="mq-item">${s.name}${SPK}</span>`).join("");document.getElementById("mq").innerHTML=set+set+set+set})();

function renderTeam(){document.getElementById("teamGrid").innerHTML=MASTERS.filter(m=>m.active).map(m=>`<div class="tm"><span class="av" style="background:${m.color}">${m.name[0]}</span><h3>${m.name}</h3><div class="rl">${roleOf(m)}</div><div class="hr">${m.hours}</div><button class="btn btn-sm" onclick="bookWith(${m.id})">${t("team_book")(m.name)}</button></div>`).join("")}
function bookWith(id){clearInterval(S.holdT);Object.assign(S,{step:1,master:id,service:null,slot:null});render();document.getElementById("booking").scrollIntoView({behavior:"smooth",block:"start"})}

let lbFocus=null;
function openLb(b){const im=b.querySelector("img"),l=document.getElementById("lb");document.getElementById("lbImg").src=im.src;document.getElementById("lbImg").alt=im.alt;lbFocus=b;l.classList.add("open");l.querySelector("button").focus()}
function closeLb(){const l=document.getElementById("lb");if(!l.classList.contains("open"))return;l.classList.remove("open");if(lbFocus)lbFocus.focus()}

function countUp(el){const to=+el.dataset.to,dec=+(el.dataset.dec||0),suf=el.dataset.suf||"";if(RM)return;const t0=performance.now(),D=1400;
  const f=n=>(dec?n.toFixed(dec).replace(".",","):Math.round(n))+suf;
  const tick=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target;
  if(el.classList.contains("rv-bars"))el.classList.add("in");else countUp(el)}),{threshold:.4});
document.querySelectorAll(".cnt,.rv-bars").forEach(el=>io.observe(el));

document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".svc-card,.tm");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")});

(()=>{const stk=document.getElementById("stk"),hero=document.querySelector(".hero"),bk=document.getElementById("booking");
  const upd=()=>{const hb=hero.getBoundingClientRect().bottom,r=bk.getBoundingClientRect();stk.classList.toggle("show",hb<0&&!(r.top<innerHeight*.6&&r.bottom>0))};
  addEventListener("scroll",upd,{passive:true});upd()})();

applyI18n();render();
</script>
